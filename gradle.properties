# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# ============================================================
# 编译需要 JDK 21(详见 README)。
# 如果你的默认 Java 版本不对,取消下面一行的注释,
# 并把路径改成你机器上的 JDK 21 安装路径:
# org.gradle.java.home=C:\\Program Files\\Microsoft\\jdk-21.0.12.8-hotspot
# ============================================================

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=1.21.11
loader_version=0.19.3
loom_version=1.17-SNAPSHOT

# Mod Properties
version=1.0.0
group=linlinger.heartstealer

# Dependencies
fabric_api_version=0.141.6+1.21.11

# ============================================================
# HeartStealer 附加依赖
# ============================================================
# 配置系统(必装,随模组打包 include)。
# 版本号 = MC版本.序号:1.21.11 对应最新 21.11.153(用户已在
# Modrinth 确认 21.11.150 ~ 21.11.153 可用)。
cloth_config_version=21.11.153
# ModMenu(可选,仅开发/测试时注入,提供配置界面入口)。
# 用户已在 Modrinth 确认 1.21.11 对应版本为 17.0.0。
modmenu_version=17.0.0
